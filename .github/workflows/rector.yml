name: Rector
'on':
  pull_request: 
  push:
    branches: 
    tags: 
env:
  default_php: '8.3'
  php_extensions: 'mbstring,json,xdebug,ldap,pdo-sqlite'
jobs:
  rector:
    name: 'Rector on Default PHP'
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      -
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '${{ env.default_php }}'
          extensions: '${{ env.php_extensions }}'
          tools: composer
      -
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
      -
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: tools/rector
      -
        run: 'tools/rector/vendor/bin/rector process --dry-run --output-format=github -c tools/rector/rector.php'
